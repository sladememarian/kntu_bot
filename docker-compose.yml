services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-kntu_secret_pw}
    # Host port 27019 avoids 27017/27018 already used by another Mongo in the VM.
    ports:
      - "27019:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  bot:
    build: .
    # No fixed container_name — avoids CI name already in use conflicts
    # after partial recreates (kntu_bot25 vs hash_kntu_bot25).
    restart: unless-stopped
    env_file: .env
    ports:
      - "8091:8091"
    environment:
      - HERMES_HOME=/app/hermes_home
      - HERMES_AGENT_DIR=/opt/hermes-agent
      - PORT=8091
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./data.json:/app/data.json
      - ./data/bob_sessions:/app/data/bob_sessions
      - ./hermes:/app/hermes:ro
      - hermes_home_data:/app/hermes_home
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('mongo', 27017), 5); from run_agent import AIAgent",
        ]
      interval: 30s
      timeout: 15s
      retries: 4
      start_period: 60s

volumes:
  mongo_data:
  hermes_home_data:
